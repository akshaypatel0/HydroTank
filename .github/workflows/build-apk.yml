name: Build & Release Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore or generate debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Ensure gradlew is executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "app/google-services.json not found in workspace, generating config..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "236708762741",
              "project_id": "gen-lang-client-0893928249",
              "storage_bucket": "gen-lang-client-0893928249.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:236708762741:android:2084264e5336d624f4d43c",
                  "android_client_info": {
                    "package_name": "com.aistudio.hydrotank.vomaga"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "236708762741-hl5npig4imd1r67gg8kiksles11ku1qm.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.hydrotank.vomaga",
                      "certificate_hash": "577e181e3ef29396d36b305450a9d0d4e82b2f49"
                    }
                  },
                  {
                    "client_id": "236708762741-dkei5rn0vd95tdkmn5f3edpk4qjs6duu.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyBcWsqQwCI5YH_LlxXNCjG09Pwvu1DJwRQ"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          ls -lh app/google-services.json

      - name: Ensure firebase_applet_config.xml exists
        run: |
          mkdir -p app/src/main/res/values
          if [ ! -f app/src/main/res/values/firebase_applet_config.xml ]; then
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-hydrotan-dd8954a1-6013-4951-84b8-06fa1db58d23</string>
          </resources>
          EOF
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/HydroSense.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydrosense-debug-apk
          path: release-apk/HydroSense.apk
          retention-days: 14

      - name: Automatically Release in GitHub as Latest
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "HydroSense Latest Release"
          body: |
            ## 💧 HydroSense - Smart Water Tank & Motor Controller
            Automated build from commit `${{ github.sha }}`.

            ### 📱 Download
            - **[HydroSense.apk](https://github.com/${{ github.repository }}/releases/download/latest/HydroSense.apk)**

            ### 🚀 Features Included:
            - 📡 **Bluetooth HC-05 Integration**: Seamless pairing and bidirectional telemetry with Arduino.
            - 🚰 **Dynamic Water Tank Visualizer**: Smooth fluid wave animation, volume, and depth indicator.
            - ⚡ **Motor & Relay Control**: Safe toggles with automated target level and overflow cutoffs.
            - 🌐 **Cloud Gateway (IoT)**: Real-time broadcast to Firestore; public read-only web link.
            - 📊 **Serial Terminal**: Live command input and timestamped debug logs.
          files: release-apk/HydroSense.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
